buildscript {
    repositories {
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        // Updated to 5.2.5 to support Gradle 8+ and remove MavenPlugin dependency
        classpath "org.jfrog.buildinfo:build-info-extractor-gradle:5.2.5"
    }
}

plugins {
    id 'java'
    id 'jacoco'
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id 'com.github.ben-manes.versions' version '0.51.0'
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish' // Required for modern Artifactory plugin
    apply plugin: "com.jfrog.artifactory"
    apply plugin: "com.github.johnrengelman.shadow"
}

repositories {
    maven { url 'https://repo.osgeo.org/repository/release/' }
    maven { url 'https://clojars.org/repo/'}
    maven { url "https://jitpack.io" }
    mavenCentral()
}

group = 'gov.nasa.podaac'

// Use Toolchains for Java 21 compliance
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    developmentOnly
    antJUnit
    runtimeClasspath {
        extendsFrom developmentOnly
    }
    runtimeOnlyResolvable {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom runtimeOnly
    }
}

configurations.all {
    resolutionStrategy {
        force 'junit:junit:4.13.2'
    }
}

dependencies {
    implementation group: 'com.vividsolutions', name: 'jts', version: '1.13'
    implementation group: 'gov.nasa.earthdata', name: 'cumulus-message-adapter', version: '2.0.0'
    implementation group: 'com.amazonaws', name: 'aws-java-sdk-s3', version: '1.12.780'
    implementation group: 'com.amazonaws', name: 'aws-lambda-java-core', version: '1.2.3'
    implementation group: 'com.amazonaws', name: 'aws-java-sdk-stepfunctions', version: '1.12.780'
    implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.14'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.11.0'
    implementation group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1.1'
    implementation group: 'org.json', name: 'json', version: '20250107'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.18.0'
    implementation group: 'commons-io', name: 'commons-io', version: '2.18.0'
    implementation group: 'edu.ucar', name: 'cdm-core', version: '5.7.0'
    implementation group: 'org.geotools', name: 'gt-shapefile', version: '34.0'
    implementation group: 'commons-cli', name: 'commons-cli', version: '1.4'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j-impl', version: '2.25.3'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.25.3'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.25.3'
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.32'
    implementation group: "com.github.everit-org.json-schema", name: "org.everit.json.schema", version: "1.14.4"
    implementation group: 'org.quartz-scheduler', name: 'quartz', version: '2.4.0'
    implementation group: 'com.beust', name: 'jcommander', version: '1.82'
    implementation group: 'org.jdom', name: 'jdom2', version: '2.0.6.1'

    antJUnit 'org.apache.ant:ant-junit:1.10.15'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.15.2'
    testImplementation 'org.openjdk.jmh:jmh-core:1.37'
    testAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

    constraints {
        implementation('com.fasterxml.jackson.core:jackson-core:2.21.1') {
            because 'SNYK-JAVA-COMFASTERXMLJACKSONCORE-15365924 fixed in 2.21.1; override transitive from GeoTools'
        }
    }
}

compileJava.dependsOn(processResources)

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}

// --- Versioning Helpers ---
def getVersionProps() {
    def versionPropsFile = file('gradle.properties')
    if (!versionPropsFile.exists()) versionPropsFile.createNewFile()
    def versionProps = new Properties()
    versionPropsFile.withInputStream { versionProps.load(it) }
    return versionProps
}

def getVersionName = { getVersionProps()['version'] ?: "0.0.0" }

def isPrerelease() {
    return getVersionName().findAll(/\d+/).size() == 4
}

def getPrereleasePrefix(){
    try { return getVersionName().split('-')[1].toString().split('\\.')[0] }
    catch(Exception e) { return 'alpha' }
}

def getVersionNamePrerelease = { (getVersionName() =~ /\d+/)[3].toInteger() }
def getVersionNamePatch = { (getVersionName() =~ /\d+/)[2].toInteger() }
def getVersionNameMinor = { (getVersionName() =~ /\d+/)[1].toInteger() }
def getVersionNameMajor = { (getVersionName() =~ /\d+/)[0].toInteger() }

private void save(major, minor, patch, prerelease) {
    if (prerelease != null) {
        def prefix = getPrereleasePrefix()
        save("${major}.${minor}.${patch}-${prefix}.${prerelease}".toString())
    } else {
        save("${major}.${minor}.${patch}".toString())
    }
}

private void save(versionName) {
    def versionProps = getVersionProps()
    versionProps['version'] = versionName
    versionProps.store(file('gradle.properties').newWriter(), null)
}

// --- Task Definitions ---

task mergeJUnitReports {
    ext {
        resultsDir = file("$buildDir/test-results/test")
        targetDir = file("$buildDir/test-results/merged")
    }
    doLast {
        ant.taskdef(name: 'junitreport',
                    classname: 'org.apache.tools.ant.taskdefs.optional.junit.XMLResultAggregator',
                    classpath: configurations.antJUnit.asPath)
        ant.junitreport(todir: resultsDir) {
            fileset(dir: resultsDir, includes: 'TEST-*.xml')
            report(todir: targetDir, format: 'frames')
        }
    }
}

task bumperInit {
    group = 'bumper'
    doLast {
        def v = project.hasProperty('version') ? version : "0.0.0-alpha.0"
        save(v == "unspecified" ? "0.0.0-alpha.0" : v)
    }
}

task bumperVersionPrerelease {
    group = 'bumper'
    doLast {
        if (isPrerelease()) save(getVersionNameMajor(), getVersionNameMinor(), getVersionNamePatch(), getVersionNamePrerelease() + 1)
        else save(getVersionNameMajor(), getVersionNameMinor(), getVersionNamePatch() + 1, 0)
    }
}

task bumperVersionPatch {
    group = 'bumper'
    doLast {
        if (isPrerelease()) save(getVersionNameMajor(), getVersionNameMinor(), getVersionNamePatch(), null)
        else save(getVersionNameMajor(), getVersionNameMinor(), getVersionNamePatch() + 1, null)
    }
}

task bumperVersionMinor {
    group = 'bumper'
    doLast {
        save(getVersionNameMajor(), getVersionNameMinor() + 1, 0, null)
    }
}

task buildZip(type: Zip) {
    group = 'builder'
    from sourceSets.main.output
    from sourceSets.main.resources
    into('lib') {
        from configurations.runtimeOnlyResolvable
    }
    archiveFileName = "forge-${getVersionName()}.zip"
}

task buildLambda(type: Zip) {
    group = 'builder'
    from sourceSets.main.output
    from sourceSets.main.resources
    into('lib') {
        from configurations.runtimeClasspath
    }
    archiveFileName = "forge-lambda.zip"
}

task copyTFFiles(type: Copy) {
    group = 'builder'
    from("$projectDir/terraform") {
        include "*.tf"
        include "fargate/**"
    }
    // Using layout.buildDirectory.dir(...) returns a Directory object directly
    into layout.buildDirectory.dir('distributions') 
}

task cleanDist(type: Delete) {
    delete 'dist'
}

task buildArtifact(type: Zip) {
    group = 'builder'
    from("$buildDir/distributions") {
        include "*.*"
        include "fargate/**"
    }
    destinationDirectory = file("$projectDir/dist")
    archiveFileName = "forge-${getVersionName()}.zip"
}

task currentVersion {
    doLast { println getVersionName() }
}

task setCurrentVersion {
    doLast {
        if (project.hasProperty("args")) save(project.getProperty("args"))
    }
}

shadowJar {
    archiveBaseName.set('footprint')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
    manifest {
        attributes 'Multi-Release': 'true', 'Main-Class': 'ActivityHandler'
    }
}

// --- Task Wiring (Dependencies) ---
buildZip.dependsOn build
buildArtifact.dependsOn buildLambda, copyTFFiles, cleanDist
